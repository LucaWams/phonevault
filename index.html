<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F0F1A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Phone Vault" />
  <title>Phone Vault</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <main id="screen"></main>

    <nav class="tab-bar" aria-label="Main navigation">
      <button class="tab active" data-tab="vault" aria-label="Vault tab">
        <span class="tab-icon">🔒</span>
        <span>Vault</span>
      </button>
      <button class="tab" data-tab="history" aria-label="History tab">
        <span class="tab-icon">🕘</span>
        <span>History</span>
      </button>
      <button class="tab" data-tab="calendar" aria-label="Calendar tab">
        <span class="tab-icon">📅</span>
        <span>Calendar</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
